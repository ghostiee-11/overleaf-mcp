[project]
name = "overleaf-latex-mcp"
version = "1.0.1"
description = "MCP server for Overleaf/LaTeX project formatting and linting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "overleaf-latex-mcp contributors" }]
keywords = [
    "overleaf",
    "latex",
    "tex",
    "mcp",
    "model-context-protocol",
    "llm",
    "ai",
    "linting",
    "formatting",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "mcp>=1.0.0",
    "overleaf-sync>=1.2.0",
    "pydantic>=2.6",
    "python-socketio[asyncio-client]>=5.11",
    "requests>=2.31",
    "websockets>=16.0",
]

[project.urls]
Homepage = "https://github.com/ghostiee-11/overleaf-mcp"
Repository = "https://github.com/ghostiee-11/overleaf-mcp"
Issues = "https://github.com/ghostiee-11/overleaf-mcp/issues"

[project.scripts]
overleaf-latex-mcp = "overleaf_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overleaf_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/**/*.png",
    "uv.lock",
    ".github",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
